# Release pipeline: on every PR merge into the trunk branch (and on
# manual workflow_dispatch), verify the codebase, then build and
# auto-submit the production profile to both stores via EAS.
#
# Direct pushes to main (rare admin-only events) do NOT auto-fire a
# release — the trigger is `pull_request: closed` gated by an
# `if: merged == true` check on each job, so releases ship only
# through the PR flow. Use workflow_dispatch for one-off manual runs.
#
# What gets gated where:
#   - The `verify` job runs TypeScript type-checking, Jest tests, and
#     ESLint. A failure in any of these blocks the release job.
#   - The `release` job only starts after `verify` passes. It uses
#     EAS to build the iOS + Android production binaries, each with
#     `--auto-submit`:
#     * iOS is delivered to App Store Connect / TestFlight. It is NOT
#       released to the App Store — you still submit for review by
#       hand.
#     * Android is delivered to the Google Play `internal` testing
#       track (see submit.production.android in eas.json). It does NOT
#       reach the public — promote internal -> production in Play
#       Console when you're happy with it.
#     Both platforms therefore stop at "delivered, human publishes";
#     a merge can never surprise real users.
#
# The Android step runs on `!cancelled()` rather than after a
# successful iOS step, so an iOS failure no longer prevents the
# Android build entirely. `!cancelled()` and not `always()`: the
# latter would also fire after someone cancels the workflow, kicking
# off a build-and-submit they just asked to stop.
#
# Versioning: `android.versionCode` and `ios.buildNumber` are stored
# REMOTELY by EAS (`cli.appVersionSource: "remote"` in eas.json) and
# bumped on every production build (`autoIncrement: true`). They
# deliberately do NOT live in app.json — under the old `local` source
# EAS incremented them inside this runner's throwaway checkout, which
# is never committed, so every release re-shipped the same build
# number. See docs/adr/0001-remote-app-version-source.md.
#
# The user-facing `expo.version` is a separate concern and stays a
# manual, per-PR bump enforced by scripts/check-version-bump.mjs.
#
# The eas-cli major is pinned. This pipeline publishes to two app
# stores unattended, so it should not silently adopt whatever
# behaviour Expo shipped that morning — a CLI-version-dependent
# default is exactly what caused the build-number bug above.
#
# Manual run: from the GitHub Actions tab pick "Release to app stores"
# and click "Run workflow".
#
# Required GitHub repo secrets:
#   EXPO_TOKEN
#     An Expo access token. Create one at:
#     https://expo.dev/accounts/danimr/settings/access-tokens
#     Then add it under Settings -> Secrets and variables -> Actions.
#
# Store credentials are managed by EAS itself (run `eas credentials`
# once locally to wire up Apple App Store Connect API keys and a
# Google Play service-account JSON). They are NOT stored in this repo.

name: Release to app stores

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

# Only one release run at a time. Don't cancel an in-flight build if
# another merge arrives — let it finish so we don't waste EAS quota
# on half-built artifacts.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Type-check, test, lint
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Jest
        run: npm test -- --ci

      - name: ESLint
        run: npm run lint

  release:
    name: EAS build + submit (iOS + Android)
    needs: verify
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: ^22.0.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install deps
        run: npm ci

      - name: Build iOS production (auto-submit to App Store Connect)
        run: eas build --profile production --platform ios --non-interactive --auto-submit

      # Runs even if the iOS step failed, so one platform's problem
      # doesn't withhold the other's release. Skipped when the whole
      # workflow is cancelled.
      - name: Build Android production AAB (auto-submit to Play internal track)
        if: ${{ !cancelled() }}
        run: eas build --profile production --platform android --non-interactive --auto-submit
